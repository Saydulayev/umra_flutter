name: umra_flutter
description: "Umrah Guide for Muslims - Flutter version"
publish_to: 'none'

version: 4.4.2+29

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Crash reporting (Firebase Crashlytics) — see lib/services/crashlytics_backend.dart
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.2.3

  # State Management
  provider: ^6.1.1
  
  # Audio Playback
  just_audio: ^0.9.42

  # Prayer Times
  adhan_dart: ^1.2.0

  # Qibla compass: геолокация (расчёт направления) + магнитометр (heading)
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  
  # Islamic Calendar
  hijri_date: ^1.0.0
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2
  
  # PDF Viewer
  flutter_pdfview: ^1.3.2
  pdf: ^3.10.7
  
  # Shared Preferences
  shared_preferences: ^2.2.2
  
  # Vibration
  vibration: ^3.1.4
  
  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
  
  # In-App Purchases
  in_app_purchase: ^3.2.0
  
  # In-App Review
  in_app_review: ^2.0.9

  # Open system settings
  app_settings: ^5.1.1
  
  cupertino_icons: ^1.0.8

  # SVG icons
  flutter_svg: ^2.2.1

  # Liquid Glass (iOS 26) UI — taб-бар со стеклянным эффектом
  liquid_glass_widgets: ^0.18.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Уже транзитивная зависимость flutter_test; прямое объявление нужно,
  # чтобы импортировать fake_async в тестах таймеров покупок (15с/60с).
  fake_async: ^1.3.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Генератор нативной заставки (splash) для iOS/Android.
  flutter_native_splash: ^2.4.0

# ─── Splash / launch screen ──────────────────────────────────────────────────
# Генерация: dart run flutter_native_splash:create
# (перезапускать после любой смены картинок/цветов ниже).
flutter_native_splash:
  # Фон следует системной теме: светлый — фон темы Nur, тёмный — фон темы Layl
  # (см. AppTheme.backgroundColor), чтобы не было «скачка» цвета при старте.
  color: "#F7F7F7"
  color_dark: "#101010"
  # По центру — иконка приложения (liquid-glass, скруглённый квадрат с подложкой):
  # логотип сохраняет оригинальные чёрно-золотые цвета в обеих темах.
  # Файлы splash_icon_* сгенерированы из AppIcon_LiquidGlass-* (800px на холсте 1024).
  image: assets/images/splash/splash_icon_light.png
  image_dark: assets/images/splash/splash_icon_dark.png
  # Надпись «Umra Guide» внизу (своя версия для каждой темы).
  branding: assets/images/splash/branding_light.png
  branding_dark: assets/images/splash/branding_dark.png
  branding_mode: bottom
  # Android 12+ рисует только иконку по центру, обрезанную по кругу Ø768 px
  # на холсте 1152×1152 — поэтому используем версии, где скруглённый квадрат
  # целиком (вместе с углами) вписан в безопасный круг (620px на холсте 1152).
  android_12:
    image: assets/images/splash/splash_icon_light_android12.png
    color: "#F7F7F7"
    image_dark: assets/images/splash/splash_icon_dark_android12.png
    color_dark: "#101010"
  android: true
  ios: true
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
