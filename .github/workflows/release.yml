name: Release (Fastlane)

# Заготовка деплоя. Пока запускается ТОЛЬКО вручную (workflow_dispatch) —
# ничего не сломает существующий .github/workflows/ci.yml и не задеплоит
# ничего само по себе, пока в репозитории не настроены секреты (см. ниже
# и docs/fastlane-setup.md).
#
# Когда всё будет готово и проверено, можно раскомментировать блок
# `push: tags:`, чтобы публиковать автоматически по тегу вида v1.2.3.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Что публиковать"
        required: true
        default: "both"
        type: choice
        options: [android, ios, both]
  # push:
  #   tags:
  #     - "v*"

env:
  FLUTTER_VERSION: "3.41.1"

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true

      # Требуемые секреты репозитория (Settings -> Secrets and variables -> Actions):
      #   ANDROID_KEYSTORE_BASE64   — `base64 -i android/app/upload-keystore.jks | pbcopy`
      #   ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS — из android/key.properties
      #   PLAY_STORE_JSON_KEY       — содержимое JSON-ключа сервисного аккаунта Google Play
      - name: Restore Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Restore key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Restore Google Play service account key
        run: echo '${{ secrets.PLAY_STORE_JSON_KEY }}' > fastlane/play-store-credentials.json

      - name: Fastlane android internal
        run: bundle exec fastlane android internal
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: fastlane/play-store-credentials.json

  ios:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true

      # Требуемые секреты репозитория:
      #   ASC_KEY_P8_BASE64          — `base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy`
      #   ASC_KEY_ID, ASC_ISSUER_ID  — из App Store Connect -> Users and Access -> Keys
      #   IOS_DIST_CERT_BASE64       — экспортированный .p12 сертификат Distribution, в base64
      #   IOS_DIST_CERT_PASSWORD     — пароль, заданный при экспорте .p12
      #   IOS_PROVISIONING_PROFILE_BASE64 — .mobileprovision профиль (App Store), в base64
      #   IOS_KEYCHAIN_PASSWORD      — любой новый пароль для временного keychain в CI
      - name: Restore App Store Connect API key
        run: echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d > fastlane/AuthKey.p8

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 -d > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Fastlane ios beta
        run: bundle exec fastlane ios beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILEPATH: fastlane/AuthKey.p8
